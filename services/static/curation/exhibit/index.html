<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AKASHA — Exhibition</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: radial-gradient(1200px 780px at 50% -6%, #1d140a 0%, #0d0904 60%, #070502 100%) fixed;
      color: #ecd7a6; -webkit-text-size-adjust: 100%;
    }
    a { color: inherit; }
    .mono { font-family: 'Courier New', monospace; }

    /* ── top bar ─────────────────────────────────────────────────── */
    .bar { position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: .7rem clamp(16px,5vw,48px);
      background: linear-gradient(to bottom, rgba(11,7,3,.94) 68%, rgba(11,7,3,0));
    }
    .crumb { font-size: .6rem; letter-spacing: 2.5px; text-transform: uppercase;
      color: rgba(200,146,58,.72); text-decoration: none; border: 1px solid rgba(200,140,55,.3);
      padding: 5px 14px; border-radius: 16px; }
    .crumb:hover { color: #f0d99a; border-color: rgba(210,150,60,.7); }
    .fmt { margin-left: auto; display: flex; gap: 6px; }
    .fmt a { font-size: .58rem; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(200,146,58,.7); text-decoration: none;
      border: 1px solid rgba(170,100,24,.3); padding: 5px 12px; border-radius: 3px; }
    .fmt a.on { color: #1c130a; background: #e8c67a; border-color: #e8c67a; font-weight: bold; }
    .fmt a:hover:not(.on) { color: #f0d99a; border-color: rgba(200,146,58,.7); }

    main { max-width: 900px; margin: 0 auto; padding: 1rem clamp(16px,5vw,48px) 12vh; }

    /* ── exhibition lead ─────────────────────────────────────────── */
    .lead { margin: 1.6rem 0 2.4rem; text-align: center; }
    .lead h1 { font-weight: 400; letter-spacing: .5px; line-height: 1.15;
      font-size: clamp(1.9rem, 5.4vw, 3rem); color: #f6e2ab;
      text-shadow: 0 0 24px rgba(220,150,50,.28); }
    .lead .thesis { margin: 1rem auto 0; max-width: 44rem; font-style: italic;
      font-size: clamp(.96rem, 2.3vw, 1.12rem); line-height: 1.75; color: rgba(226,205,158,.86); }
    .lead .grounds { margin-top: 1rem; font-size: .58rem; letter-spacing: 2.5px;
      text-transform: uppercase; color: rgba(200,146,58,.6); }

    /* ── scroll: scene cards ─────────────────────────────────────── */
    .scene { padding: 2rem 0; border-top: 1px solid rgba(170,100,24,.16); }
    .scene:first-of-type { border-top: none; }
    .scene .no { font-size: .58rem; letter-spacing: 3px; color: rgba(200,146,58,.5); }
    .scene h2 { font-weight: 400; font-size: clamp(1.4rem, 3.6vw, 2rem); color: #f2dca0;
      letter-spacing: .3px; margin: .3rem 0 .7rem; }
    .scene h2 a { text-decoration: none; border-bottom: 1px solid transparent; }
    .scene h2 a:hover { border-color: rgba(200,146,58,.5); }
    .scene figure { margin: 0 0 1rem; }
    .scene img { width: 100%; max-height: 460px; object-fit: cover; border-radius: 4px;
      border: 1px solid rgba(170,100,24,.3); display: block; background: #140d05; }
    .scene figcaption { font-size: .58rem; letter-spacing: 1px; color: rgba(190,160,110,.55);
      margin-top: .35rem; text-align: right; }
    .scene .desc { font-size: 1.02rem; line-height: 1.8; color: rgba(232,214,172,.9); }
    .scene .cap { margin-top: .8rem; font-style: italic; font-size: .9rem; color: rgba(210,180,120,.7); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1.1rem; align-items: center; }
    .row .lbl { font-size: .54rem; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(200,146,58,.5); margin-right: 4px; }
    .chip { font-size: .78rem; text-decoration: none; color: rgba(232,206,168,.9);
      border: 1px solid rgba(170,100,24,.35); padding: 3px 10px; border-radius: 14px; }
    .chip:hover { color: #fff2cf; border-color: rgba(200,146,58,.75); }
    .ref { font-size: .72rem; text-decoration: none; color: rgba(232,206,168,.92);
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid rgba(170,100,24,.4); padding: 4px 10px; border-radius: 3px; }
    .ref:hover { color: #fff2cf; border-color: rgba(200,146,58,.8); }
    .ref .src { font-family: 'Courier New', monospace; font-size: .5rem; letter-spacing: 1.5px;
      text-transform: uppercase; color: #1c130a; background: #d8ad55; padding: 1px 5px; border-radius: 2px; }

    /* ── kamishibai: one panel at a time ─────────────────────────── */
    .kami { min-height: 74vh; display: flex; flex-direction: column; justify-content: center; }
    .kami .panel { animation: fade .35s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .blocks { display: flex; flex-direction: column; gap: 1rem; }
    .block.image img { width: 100%; max-height: 52vh; object-fit: cover; border-radius: 4px;
      border: 1px solid rgba(170,100,24,.3); }
    .block.quote { border-left: 3px solid rgba(200,146,58,.5); padding-left: 1rem; font-style: italic;
      color: rgba(220,196,150,.85); }
    .block.caption { color: rgba(210,180,120,.75); font-style: italic; }
    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center; gap: 20px;
      padding: .9rem; background: linear-gradient(to top, rgba(11,7,3,.95) 60%, rgba(11,7,3,0)); }
    .nav button { font-family: inherit; cursor: pointer; font-size: 1rem;
      color: rgba(200,146,58,.85); background: transparent; border: 1px solid rgba(170,100,24,.4);
      width: 3rem; height: 2.3rem; border-radius: 4px; }
    .nav button:hover:not(:disabled) { color: #f0d99a; border-color: rgba(200,146,58,.8); }
    .nav button:disabled { opacity: .3; cursor: default; }
    .nav .pos { font-family: 'Courier New', monospace; font-size: .8rem; color: rgba(200,146,58,.7);
      min-width: 4rem; text-align: center; }

    .note { color: rgba(200,180,140,.6); font-size: .9rem; text-align: center; margin: 4rem auto; }
    .note a { color: rgba(220,160,80,.9); }
  </style>
</head>
<body>
  <div class="bar">
    <a class="crumb" href="/curation/">◄ curation gallery</a>
    <div class="fmt" id="fmt"></div>
  </div>
  <main id="main"><p class="note">Loading the exhibition…</p></main>

  <script>
  (function () {
    'use strict';
    function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
    function qp(k) { return new URLSearchParams(location.search).get(k) || ''; }
    var slug = qp('slug');
    var fmt  = (qp('fmt') || 'scroll').toLowerCase();
    if (fmt !== 'scroll' && fmt !== 'kamishibai') fmt = 'scroll';

    function fmtBar() {
      var f = document.getElementById('fmt');
      if (!slug) { f.innerHTML = ''; return; }
      f.innerHTML = ['scroll', 'kamishibai'].map(function (m) {
        var label = m === 'kamishibai' ? '紙芝居' : 'scroll';
        var on = m === fmt ? ' on' : '';
        return '<a class="' + on.trim() + '" href="?slug=' + encodeURIComponent(slug) + '&fmt=' + m + '">' + label + '</a>';
      }).join('');
    }

    // A scene renders the same self-contained card in both formats.
    function sceneCard(s) {
      var h = '';
      h += '<div class="no mono">SCENE ' + ((s.scene != null ? s.scene : 0) + 1) + '</div>';
      if (s.image && s.image.url) {
        h += '<figure><img loading="lazy" src="' + esc(s.image.url) + '" alt="' + esc(s.headword) + '"' +
             ' onerror="this.closest(&quot;figure&quot;).style.display=&quot;none&quot;">';
        var cred = s.image.attribution || s.image.source;
        if (cred) h += '<figcaption>' + esc(cred) + '</figcaption>';
        h += '</figure>';
      }
      var head = esc(s.headword || s.ref_id || '');
      h += '<h2>' + (s.href ? '<a href="' + esc(s.href) + '">' + head + '</a>' : head) + '</h2>';
      if (s.description) h += '<p class="desc">' + esc(s.description) + '</p>';
      if (s.caption) h += '<p class="cap">' + esc(s.caption) + '</p>';
      if (s.links && s.links.length) {
        h += '<div class="row"><span class="lbl">related</span>' + s.links.map(function (l) {
          return '<a class="chip" href="' + esc(l.href) + '">' + esc((l.name || '').split(':').pop()) + '</a>';
        }).join('') + '</div>';
      }
      if (s.refs && s.refs.length) {
        h += '<div class="row"><span class="lbl">sources</span>' + s.refs.map(function (r) {
          return '<a class="ref" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
                 '<span class="src">' + esc(r.source || 'ref') + '</span>' + esc(r.label || r.url) + ' ↗</a>';
        }).join('') + '</div>';
      }
      return h;
    }

    // kamishibai: prefer the Frame's blocks[] layout; else fall back to the card.
    function kamiPanel(s) {
      if (!s.blocks || !s.blocks.length) return sceneCard(s);
      var h = '<div class="no mono">SCENE ' + ((s.scene != null ? s.scene : 0) + 1) + '</div>';
      h += '<h2>' + esc(s.headword || '') + '</h2><div class="blocks">';
      s.blocks.forEach(function (b) {
        var role = (b.role || 'item');
        if (role === 'image' || (b.ref_id && /^img|image/i.test(b.ref_id))) {
          if (b.ref_id) h += '<div class="block image"><img loading="lazy" src="' + esc(b.body || b.ref_id) +
            '" alt="' + esc(b.headword || '') + '" onerror="this.closest(&quot;.block&quot;).style.display=&quot;none&quot;"></div>';
        } else if (role === 'quote') {
          h += '<div class="block quote">' + esc(b.body || b.headword) + '</div>';
        } else if (role === 'caption') {
          h += '<div class="block caption">' + esc(b.body || b.headword) + '</div>';
        } else {
          h += '<div class="block"><p class="desc">' + esc(b.body || b.headword) + '</p></div>';
        }
      });
      h += '</div>';
      return h;
    }

    function renderLead(ex) {
      var g = ex.grounds || {};
      var gr = '';
      if (g.rels && g.rels.length) gr = g.rels.join(' ∩ ') + (g.op && g.op !== 'authored' ? '  ·  ' + g.op : '');
      else if (g.op) gr = g.op;
      return '<div class="lead"><h1>' + esc(ex.title || 'Untitled exhibition') + '</h1>' +
        (ex.thesis ? '<p class="thesis">' + esc(ex.thesis) + '</p>' : '') +
        (gr ? '<div class="grounds">' + esc(gr) + '</div>' : '') + '</div>';
    }

    function renderScroll(ex) {
      var main = document.getElementById('main');
      var html = renderLead(ex);
      (ex.scenes || []).forEach(function (s) { html += '<section class="scene">' + sceneCard(s) + '</section>'; });
      main.innerHTML = html;
    }

    function renderKami(ex) {
      var main = document.getElementById('main');
      var scenes = ex.scenes || [];
      var i = -1;                                   // -1 = the title/lead panel
      function draw() {
        var body = (i < 0) ? renderLead(ex) : '<div class="panel">' + kamiPanel(scenes[i]) + '</div>';
        main.innerHTML = '<div class="kami">' + body + '</div>';
        document.getElementById('prev').disabled = (i <= -1);
        document.getElementById('next').disabled = (i >= scenes.length - 1);
        document.getElementById('pos').textContent = (i < 0 ? '—' : (i + 1)) + ' / ' + scenes.length;
      }
      document.body.insertAdjacentHTML('beforeend',
        '<div class="nav"><button id="prev" aria-label="previous">‹</button>' +
        '<span class="pos mono" id="pos"></span>' +
        '<button id="next" aria-label="next">›</button></div>');
      document.getElementById('prev').addEventListener('click', function () { if (i > -1) { i--; draw(); } });
      document.getElementById('next').addEventListener('click', function () { if (i < scenes.length - 1) { i++; draw(); } });
      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft' && i > -1) { i--; draw(); }
        else if (e.key === 'ArrowRight' && i < scenes.length - 1) { i++; draw(); }
      });
      draw();
    }

    function fail(msg) {
      document.getElementById('main').innerHTML =
        '<p class="note">' + esc(msg) + '<br><a href="/curation/">← back to the curation gallery</a></p>';
    }

    fmtBar();
    if (!slug) { fail('No exhibition selected.'); return; }
    fetch('/curation/exports/' + encodeURIComponent(slug) + '.' + fmt + '.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(function (ex) {
        if (!ex || !ex.scenes) { fail('This exhibition has no scenes yet.'); return; }
        document.title = 'AKASHA — ' + (ex.title || 'Exhibition');
        if (fmt === 'kamishibai') renderKami(ex); else renderScroll(ex);
      })
      .catch(function () {
        fail('This exhibition ("' + esc(slug) + '") is not published yet.');
      });
  }());
  </script>
<!-- pulse beacon (F18) — fire-and-forget access analytics; never breaks the page -->
<script>
(function () {
  try {
    var prev = ''; try { prev = sessionStorage.getItem('pulse_prev') || ''; } catch (e) {}
    var concept = 'site:archives_exhibit';
    var payload = { concept: concept, surface: 'exhibit', prev: prev,
                    page_referrer: document.referrer || '' };
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/pulse', new Blob([JSON.stringify(payload)],
                                              { type: 'application/json' }));
    }
    try { sessionStorage.setItem('pulse_prev', concept); } catch (e) {}
  } catch (e) { /* analytics must never break a page */ }
})();
</script>
</body>
</html>
