<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ancient Civilizations</title>
<meta name="description" content="The Ancient Civilizations Archives — an antique world map of the Akashic Archives, gathering the ancient cultures of every continent by region: the river cradles, but also Mesoamerica and the Andes, sub-Saharan Africa, the steppe, Oceania and Polynesia, and more.">
<style>
    /* An antique-cartography aesthetic — aged parchment, sepia ink, a red wax route.
       Colours painted explicitly (not theme-dependent). */
    :root{
        --parch:#e9dcbe; --parch-2:#e2d2ad; --parch-3:#d8c39a; --sea:#cdc09b; --sea-2:#c3b58c;
        --ink:#3f2d18; --ink-2:#5a4526; --sepia:#7a5a30; --gold:#9a6f2e; --gold-2:#b98a3c;
        --wax:#9a3021; --wax-2:#b8402c; --line:rgba(90,62,30,.34); --faint:#8a744f;
        --text:#392a17; --muted:#6b573a; --panel:#efe6cf; --panel-2:#e6d8b6;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{
        background:
          radial-gradient(1200px 700px at 50% -6%, rgba(154,111,46,.16), transparent 60%),
          radial-gradient(900px 560px at 50% 110%, rgba(154,48,33,.10), transparent 60%),
          radial-gradient(1400px 900px at 50% 50%, var(--parch) 0%, var(--parch-2) 58%, var(--parch-3) 100%);
        color:var(--text);
        font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
        min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;line-height:1.6;overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    /* aged-paper speckle + a soft vignette */
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;mix-blend-mode:multiply;
        background-image:
          radial-gradient(circle at 18% 32%, rgba(120,88,44,.10) 0 2px, transparent 3px),
          radial-gradient(circle at 72% 20%, rgba(120,88,44,.08) 0 2px, transparent 3px),
          radial-gradient(circle at 46% 74%, rgba(120,88,44,.09) 0 2px, transparent 3px),
          radial-gradient(circle at 88% 62%, rgba(120,88,44,.07) 0 2px, transparent 3px);
        background-size:340px 340px,300px 300px,380px 380px,260px 260px;}
    body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
        box-shadow:inset 0 0 220px rgba(70,46,18,.34), inset 0 0 60px rgba(70,46,18,.20);}
    .wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:20px max(18px,env(safe-area-inset-left)) 60px}

    .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 14px}
    .crumb{font-family:'Courier New',monospace;font-size:.58rem;letter-spacing:2.5px;text-transform:uppercase;
        color:var(--muted);border:1px solid var(--line);padding:6px 13px;border-radius:2px;transition:.2s;background:rgba(255,250,235,.25)}
    .crumb:hover{color:var(--wax-2);border-color:var(--gold)}

    /* ── masthead: a compass rose + a wax seal ── */
    .mast{display:flex;align-items:center;gap:22px;padding:12px 0 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .rose{flex:0 0 auto}
    .mast .t h1{font-size:clamp(1.5rem,4.2vw,2.4rem);font-weight:600;letter-spacing:.05em;color:var(--ink);
        font-variant:small-caps}
    .mast .t .sc{display:block;font-size:.82rem;color:var(--sepia);letter-spacing:.24em;margin-top:2px;font-variant:small-caps}
    .mast .t .sub{font-size:.72rem;color:var(--muted);letter-spacing:.05em;margin-top:8px;max-width:56ch}
    .seal{margin-left:auto;flex:0 0 auto;width:56px;height:56px;border:2px solid var(--wax);border-radius:50%;
        display:flex;align-items:center;justify-content:center;color:var(--wax-2);font-size:1.4rem;
        transform:rotate(-6deg);box-shadow:0 0 0 3px rgba(154,48,33,.10);background:rgba(184,64,44,.06)}
    @media (max-width:620px){.seal{display:none}}

    .lead{font-size:.96rem;color:var(--text);margin:20px 2px 4px;max-width:66ch}
    .lead .em{color:var(--wax-2);font-style:italic}

    /* ── the atlas: map + key side by side ── */
    .atlas{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-top:16px;align-items:start}
    @media (max-width:880px){.atlas{grid-template-columns:1fr}}
    .mapframe{position:relative;border:1px solid var(--gold);border-radius:3px;overflow:hidden;
        box-shadow:0 10px 30px rgba(60,40,16,.28), 0 0 0 6px var(--parch) inset;background:var(--sea)}
    .mapframe svg{display:block;width:100%;height:auto}
    .pin{cursor:pointer}
    .pin .pdot{fill:var(--wax);stroke:#f3e8cf;stroke-width:1.4;transition:.18s}
    .pin .pnum{fill:#f6ecd4;font:700 10px 'Courier New',monospace;text-anchor:middle}
    .pin .phalo{fill:var(--wax);opacity:0;transition:.18s}
    .pin:hover .phalo{opacity:.20}
    .pin:hover .pdot{fill:var(--wax-2);stroke:#fff}
    .pin.act .pdot{fill:var(--gold-2);stroke:#fff}

    /* ── map key (also the small-screen nav) ── */
    .key{border:1px solid var(--line);border-radius:3px;background:linear-gradient(180deg,var(--panel),var(--panel-2));
        padding:12px 12px 8px}
    .key h2{font-size:.6rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);
        border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
    .krow{display:flex;align-items:baseline;gap:10px;padding:8px 8px;border-radius:2px;cursor:pointer;transition:.16s}
    .krow:hover{background:rgba(154,111,46,.12)}
    .krow .kn{flex:0 0 auto;width:20px;height:20px;border:1px solid var(--gold);border-radius:50%;
        display:flex;align-items:center;justify-content:center;font:700 .62rem 'Courier New',monospace;color:var(--wax-2)}
    .krow .kt{font-size:.86rem;color:var(--ink);letter-spacing:.01em}
    .krow .ks{display:block;font-size:.62rem;color:var(--muted);letter-spacing:.02em}
    .krow .kc{margin-left:auto;flex:0 0 auto;align-self:center;font-size:.58rem;color:var(--faint);font-family:'Courier New',monospace}

    /* ── region hall ── */
    .rmast{display:flex;align-items:baseline;gap:14px;margin:6px 2px 4px;flex-wrap:wrap}
    .rmast .rn{flex:0 0 auto;width:34px;height:34px;border:2px solid var(--gold);border-radius:50%;
        display:flex;align-items:center;justify-content:center;font:700 .9rem 'Courier New',monospace;color:var(--wax-2)}
    .rmast h2{font-size:clamp(1.3rem,3.4vw,1.9rem);color:var(--ink);font-variant:small-caps;letter-spacing:.03em}
    .rmast .rs{font-size:.66rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
    .rlead{font-size:.9rem;color:var(--muted);margin:6px 2px 2px;max-width:70ch;font-style:italic}
    .rule{height:1px;background:linear-gradient(90deg,transparent,var(--line) 16%,var(--line) 84%,transparent);margin:18px 0}

    .civs{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-top:6px}
    .civ{position:relative;border:1px solid var(--line);border-radius:3px;background:linear-gradient(180deg,var(--panel),var(--panel-2));
        padding:14px 15px 13px;transition:.18s;display:block}
    a.civ:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 12px 26px rgba(60,40,16,.24)}
    .civ .cn{font-size:1.04rem;color:var(--ink);letter-spacing:.01em;font-variant:small-caps}
    .civ .nat{font-size:.74rem;color:var(--sepia);font-style:italic;margin-left:2px}
    .civ .era{display:inline-block;font-family:'Courier New',monospace;font-size:.58rem;letter-spacing:.06em;
        color:var(--wax-2);border:1px solid rgba(154,48,33,.3);border-radius:2px;padding:2px 6px;margin-top:6px;background:rgba(184,64,44,.05)}
    .civ p{font-size:.8rem;color:var(--muted);margin-top:8px}
    .civ .go{position:absolute;right:12px;top:12px;font-size:.6rem;color:var(--faint);opacity:0;transition:.18s}
    a.civ:hover .go{opacity:1;color:var(--gold-2)}

    .back{display:inline-flex;align-items:center;gap:7px;margin:2px 2px 14px;font-size:.62rem;letter-spacing:1.5px;
        text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:7px 13px;border-radius:2px;cursor:pointer;transition:.2s;background:rgba(255,250,235,.3)}
    .back:hover{color:var(--wax-2);border-color:var(--gold)}
    .note{font-size:.62rem;color:var(--faint);margin-top:14px;font-family:'Courier New',monospace;letter-spacing:.04em}

    .foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-family:'Courier New',monospace;
        font-size:.55rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .foot a{color:var(--muted)} .foot a:hover{color:var(--wax-2)}
</style>
</head>

            <circle cx="41" cy="41" r="22" fill="none" stroke="var(--line)" stroke-width="1"/>
            <g stroke="var(--sepia)" stroke-width="1" opacity=".8">

        <div class="t">

          {name:'Babylonia', nat:'Bābilim', era:'c.1894–539 BCE', note:'Hammurabi’s law-code; Nebuchadnezzar’s hanging gardens.', atom:'ancient:babylon'},
          {name:'Assyria', nat:'Aššur', era:'c.2500–609 BCE', note:'Iron armies and the great library of Ashurbanipal at Nineveh.', atom:'ancient:assyria'},
          {name:'Elam', nat:'Haltamti', era:'c.3200–539 BCE', note:'The kingdom of Susa, ancient rival of Sumer.', atom:'ancient:elam'},
          {name:'Hittites', nat:'Hatti', era:'c.1650–1180 BCE', note:'An Anatolian iron-age power ruled from Hattusa.', atom:'ancient:hittite'},
          {name:'Phoenicia', nat:'Kanaʿan', era:'c.1500–300 BCE', note:'Sea-traders of Tyre and Sidon who gave the world its alphabet.', atom:'ancient:phoenicia'}
        ]},
      { no:2, id:'egypt', name:'Ancient Egypt & the Nile', sub:'the gift of the river', lon:31, lat:25,

        civs:[

      { no:13, id:'oceania', name:'Oceania & Polynesia', sub:'the voyagers of the great ocean', lon:150, lat:-18,
        lead:'The longest human migration — the settlement of a third of the planet by open-ocean canoe.',
        civs:[
          {name:'Lapita', nat:'Lapita', era:'c.1600–500 BCE', note:'The ancestral pottery-making voyagers of the Pacific.', atom:'ancient:lapita'},
          {name:'Polynesian Voyagers', nat:'the great triangle', era:'c.900–1300 CE', note:'The settlement of the Pacific from Hawaiʻi to Aotearoa.', atom:'ancient:polynesia'},
          {name:'Rapa Nui', nat:'Rapa Nui', era:'c.1200–1700 CE', note:'Easter Island and its moai.', atom:'ancient:rapa_nui'},
          {name:'Māori', nat:'Māori', era:'c.1300 CE–', note:'The settling of Aotearoa / New Zealand.', atom:'ancient:maori'},
          {name:'Hawaiian & Tongan states', nat:'Hawaiʻi · Tonga', era:'c.1000–1800 CE', note:'Island chiefdoms and the sea-empire of the Tuʻi Tonga.', atom:'ancient:tonga'},

    var BY = {}; REGIONS.forEach(function (r) { BY[r.id] = r; });
    var host = document.getElementById('view');
    // equirectangular projection onto the 1000×520 map
    function px(lon){ return (lon + 180) / 360 * 1000; }
    function py(lat){ return (90 - lat) / 180 * 520; }

    /* ── the antique world map (stylised continents, an old chart of the ancient world) ── */
    function mapSVG() {
        return '' +
        '<svg viewBox="0 0 1000 520" role="img" aria-label="antique world map">' +
          '<defs>' +
            '<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0" stop-color="#d2c49d"/><stop offset="1" stop-color="#c2b489"/></linearGradient>' +
            '<pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">' +
              '<line x1="0" y1="0" x2="0" y2="7" stroke="rgba(90,62,30,.20)" stroke-width="1"/></pattern>' +
          '</defs>' +
          '<rect x="0" y="0" width="1000" height="520" fill="url(#seaG)"/>' +
          // faint graticule
          '<g stroke="rgba(90,62,30,.14)" stroke-width="1">' +
            gratLines() +
          '</g>' +
          // rhumb lines from a compass point in the ocean
          '<g stroke="rgba(120,70,30,.14)" stroke-width="1">' + rhumb(150, 405) + '</g>' +
          // equator (emphasised)
          '<line x1="0" y1="260" x2="1000" y2="260" stroke="rgba(120,70,30,.30)" stroke-width="1" stroke-dasharray="6 5"/>' +
          // ── land ──
          '<g fill="#d8bf90" stroke="#5a4526" stroke-width="1.5" stroke-linejoin="round">' +
            LAND.map(function (d) { return '<path d="' + d + '"/>'; }).join('') +
          '</g>' +
          // coastal hatch shadow (a thin inner echo)
          '<g fill="url(#hatch)" opacity=".5" stroke="none">' +
            LAND.map(function (d) { return '<path d="' + d + '"/>'; }).join('') +
          '</g>' +
          // compass rose (ocean, lower-left)
          compassRose(150, 405, 38) +
          // a sea flourish (whale) far in the Pacific
          '<g transform="translate(70,150)" fill="none" stroke="rgba(90,62,30,.34)" stroke-width="1.2">' +
            '<path d="M0,0 q16,-11 34,-3 q10,4 16,-2 q-3,9 -12,9 q-20,6 -38,-4 z"/>' +
            '<path d="M34,-3 q4,-7 10,-8 q-2,6 -4,9"/></g>' +
          // cartouche title (upper-left ocean)
          '<g transform="translate(30,26)">' +
            '<rect x="0" y="0" width="250" height="52" rx="4" fill="rgba(233,220,190,.86)" stroke="#9a6f2e" stroke-width="1.4"/>' +
            '<rect x="5" y="5" width="240" height="42" rx="3" fill="none" stroke="rgba(90,62,30,.4)" stroke-width="0.8"/>' +
            '<text x="125" y="23" text-anchor="middle" font-family="Palatino,Georgia,serif" font-size="15" fill="#3f2d18" font-style="italic">Orbis Antiquus</text>' +
            '<text x="125" y="39" text-anchor="middle" font-family="Courier New,monospace" font-size="8" letter-spacing="2" fill="#7a5a30">THE ANCIENT WORLD · BY REGION</text>' +
          '</g>' +
          '<g id="pins"></g>' +
        '</svg>';
    }
    function gratLines() {
        var s = '';
        for (var lon = -150; lon <= 150; lon += 30) { var x = px(lon); s += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="520"/>'; }
        for (var lat = -60; lat <= 60; lat += 30) { var y = py(lat); s += '<line x1="0" y1="' + y + '" x2="1000" y2="' + y + '"/>'; }
        return s;
    }
    function rhumb(cx, cy) {
        var s = '', R = 900;
        for (var a = 0; a < 360; a += 45) { var rad = a * Math.PI / 180; s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(rad) * R) + '" y2="' + (cy + Math.sin(rad) * R) + '"/>'; }
        return s;
    }
    function compassRose(cx, cy, r) {
        function pt(a, rr) { var rad = a * Math.PI / 180; return (cx + Math.cos(rad) * rr) + ',' + (cy + Math.sin(rad) * rr); }
        var s = '<g opacity=".92">';
        s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(90,62,30,.5)" stroke-width="1"/>';
        s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * .62) + '" fill="none" stroke="rgba(90,62,30,.3)" stroke-width="1"/>';
        // 8 points
        for (var a = 0; a < 360; a += 45) {
            var main = (a % 90 === 0);
            var rr = main ? r : r * .66;
            s += '<polygon points="' + pt(a, rr) + ' ' + pt(a + 12, r * .2) + ' ' + cx + ',' + cy + '" fill="' + (main ? 'rgba(154,48,33,.75)' : 'rgba(63,45,24,.6)') + '"/>';
            s += '<polygon points="' + pt(a, rr) + ' ' + pt(a - 12, r * .2) + ' ' + cx + ',' + cy + '" fill="' + (main ? 'rgba(90,62,30,.6)' : 'rgba(90,62,30,.4)') + '"/>';
        }
        s += '<circle cx="' + cx + '" cy="' + cy + '" r="3.4" fill="#9a6f2e"/>';
        s += '<text x="' + cx + '" y="' + (cy - r - 4) + '" text-anchor="middle" font-family="Courier New,monospace" font-size="9" fill="#3f2d18">N</text>';
        s += '</g>';
        return s;
    }

      // Greenland
      'M300,66 C330,58 356,70 350,92 C346,112 320,120 306,108 C292,98 288,74 300,66 Z',
      // South America
      'M250,300 C280,286 306,296 312,318 C320,300 342,308 336,330 C348,356 326,380 314,368 C316,398 296,430 280,414 C286,388 268,372 272,350 C256,356 246,336 258,326 C244,320 240,306 250,300 Z',
      // Europe
      'M470,120 C500,110 528,116 540,130 C556,126 566,140 552,150 C566,158 552,170 538,164 C544,178 520,184 512,172 C500,186 478,178 484,164 C468,168 462,150 476,146 C462,138 462,126 470,120 Z',
      // Africa
      'M470,196 C512,184 566,190 590,208 C606,222 604,250 588,262 C598,286 580,318 560,342 C548,362 520,368 512,346 C498,332 500,306 512,296 C494,290 486,266 500,256 C482,250 470,228 480,214 C470,210 464,200 470,196 Z',
      // Asia (the great landmass)
      'M556,108 C640,86 740,92 812,110 C860,122 892,120 900,140 C878,150 892,168 866,166 C878,186 846,196 826,186 C832,206 800,214 786,200 C770,214 742,206 748,190 C716,196 690,214 676,196 C660,210 632,204 640,186 C610,196 586,190 566,176 C548,182 536,164 550,154 C534,146 538,122 556,108 Z',
      // India (subcontinent point)
      'M660,196 C690,192 712,200 706,222 C700,246 682,268 668,252 C660,236 654,214 660,196 Z',
      // Arabia
      'M596,184 C624,180 640,192 632,210 C624,228 604,232 596,216 C588,204 586,190 596,184 Z',

      'M760,232 C792,224 812,236 806,254 C820,250 828,264 814,272 C826,284 806,294 792,284 C796,300 772,304 766,288 C752,296 740,282 750,272 C736,268 742,250 758,250 C752,242 752,236 760,232 Z',
      // Japan
      'M868,150 C882,146 888,160 880,172 C874,184 862,190 860,178 C858,166 858,154 868,150 Z',

      'M452,120 C464,116 470,128 462,138 C456,148 446,148 446,136 C446,128 446,122 452,120 Z',

      'M820,326 C862,314 906,322 918,344 C926,362 906,382 882,384 C852,390 826,374 822,352 C812,344 812,330 820,326 Z',
      // Madagascar
      'M612,318 C622,314 628,326 622,340 C616,354 606,352 606,338 C606,328 604,322 612,318 Z',
      // New Zealand
      'M934,372 C944,368 948,380 940,392 C934,402 926,398 928,388 C928,380 926,376 934,372 Z'
    ];

    function renderMap() {
        host.innerHTML =
            '<p class="lead">An <span class="em">old chart of the ancient world</span> — and of the older new world across the sea. ' +
            'Every ancient culture is set on the map by region; choose a numbered landfall, or read the key beside it.</p>' +
            '<div class="atlas">' +
              '<div class="mapframe">' + mapSVG() + '</div>' +
              '<div class="key"><h2>Map Key · the fourteen spheres</h2>' +
                REGIONS.map(function (r) {
                    return '<div class="krow" data-region="' + r.id + '"><span class="kn">' + r.no + '</span>' +
                        '<span><span class="kt">' + esc(r.name) + '</span>' +
                        '<span class="ks">' + esc(r.sub) + '</span></span>' +
                        '<span class="kc">' + r.civs.length + '</span></div>';
                }).join('') +
              '</div>' +
            '</div>' +
            '<p class="note">Read-only. Each landfall opens a hall of that region’s cultures; a culture opens its place in the Akasha knowledge graph.</p>';
        // pins on the map
        var pins = host.querySelector('#pins');
        pins.innerHTML = REGIONS.map(function (r) {
            var x = px(r.lon), y = py(r.lat);
            return '<g class="pin" data-region="' + r.id + '" transform="translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')">' +
                '<circle class="phalo" r="14"/><circle class="pdot" r="9"/>' +
                '<text class="pnum" y="3.4">' + r.no + '</text>' +
                '<title>' + esc(r.name) + '</title></g>';
        }).join('');
        bind();
    }

    function renderRegion(id) {
        var r = BY[id]; if (!r) { renderMap(); return; }
        host.innerHTML =
            '<span class="back" data-region="__home">◄ the world map</span>' +
            '<div class="rmast"><span class="rn">' + r.no + '</span>' +
              '<h2>' + esc(r.name) + '</h2><span class="rs">' + esc(r.sub) + '</span></div>' +
            '<p class="rlead">' + esc(r.lead) + '</p>' +
            '<div class="rule"></div>' +
            '<div class="civs">' + r.civs.map(function (c) {
                return '<a class="civ" href="' + wordHref(c.atom || c.name) + '">' +
                    '<span class="go">graph ▸</span>' +
                    '<div class="cn">' + esc(c.name) + (c.nat ? ' <span class="nat">' + esc(c.nat) + '</span>' : '') + '</div>' +
                    '<span class="era">' + esc(c.era) + '</span>' +
                    '<p>' + esc(c.note) + '</p></a>';
            }).join('') + '</div>' +
            '<p class="note">Every culture links to the Akasha knowledge graph — its atom lights up as the ontology grows.</p>';
        bind();
    }

    function bind() {
        Array.prototype.forEach.call(host.querySelectorAll('[data-region]'), function (el) {
            el.addEventListener('click', function () {
                var id = el.getAttribute('data-region');
                setView(id === '__home' ? 'home' : id);
            });
        });
    }

    function beacon(id) {
        try {
            if (!navigator.sendBeacon) return;
            var prev = ''; try { prev = sessionStorage.getItem('pulse_prev') || ''; } catch (e) {}
            var concept = 'site:ancient_home';
            navigator.sendBeacon('/pulse', new Blob([JSON.stringify(
                { concept: concept, surface: 'ancient:' + id, prev: prev, page_referrer: document.referrer || '' })], { type: 'application/json' }));
            try { sessionStorage.setItem('pulse_prev', concept); } catch (e) {}
        } catch (e) {}
    }

    function setView(id) {
        var isHome = (id === 'home' || !BY[id]);
        try { history.replaceState(null, '', isHome ? location.pathname : '#' + id); } catch (e) {}
        if (isHome) renderMap(); else renderRegion(id);
        document.getElementById('foot-meta').textContent = 'ancient civilizations · ' + (isHome ? 'atlas' : id);
        window.scrollTo(0, 0);
        beacon(isHome ? 'atlas' : id);
    }
    function fromHash() { var m = (location.hash.match(/[a-z_]+/) || [])[0]; return (m && BY[m]) ? m : 'home'; }
    window.addEventListener('hashchange', function () { setView(fromHash()); });
    setView(fromHash());
}());
